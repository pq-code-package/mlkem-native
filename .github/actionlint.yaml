self-hosted-runner:
  labels:
    # actionlint 1.7.12 does not recognize the Xcode-versioned images yet
    - xcode-27
    # actionlint 1.7.12 does not recognize the Ubuntu 26.04 images yet
    - ubuntu-26.04-arm
    # PQCP runners
    - pqcp-arm64
    - pqcp-ppc64
    - pqcp-x64
    # RISE RISC-V runner
    - ubuntu-24.04-riscv
    - self-hosted-nucleo-n657x0

paths:
  .github/workflows/cbmc_publish.yml:
    ignore:
      # actionlint 1.7.12 predates retained concurrency queues.
      - 'unexpected key "queue" for "concurrency" section'
