name: CBMC
permissions:
  contents: read
on:
  workflow_call:
    secrets:
      AWS_GITHUB_TOKEN:
        description: Token for registering EC2 runners and reading the nix cache
        required: false
  workflow_dispatch:

jobs:
  cbmc:
    name: CBMC (ML-KEM-${{ matrix.level }})
    if: ${{ github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    strategy:
      fail-fast: false
      matrix:
        include:
          - k: 2
            level: 512
          - k: 3
            level: 768
          - k: 4
            level: 1024
    uses: ./.github/workflows/ci_ec2_reusable.yml
    with:
      name: CBMC (MLKEM-${{ matrix.level }})
      ec2_instance_type: r8g.xlarge
      ec2_ami: ubuntu (aarch64)
      ec2_volume_size: 20
      platform: native
      opt: no_opt
      lint: false
      verbose: true
      test: false
      cbmc: true
      cbmc_mlkem_k: ${{ matrix.k }}
    secrets:
      AWS_GITHUB_TOKEN: ${{ secrets.AWS_GITHUB_TOKEN }}
  coverage:
    name: CBMC proof coverage
    needs: cbmc
    if: ${{ always() && github.repository_owner == 'pq-code-package' && !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: 'read'
      pull-requests: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download CBMC coverage
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: cbmc-coverage-mlkem-k*
          path: ${{ runner.temp }}/cbmc-coverage
      - name: Join and check CBMC coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/actions/cbmc/coverage.py \
            --reports-dir "$RUNNER_TEMP/cbmc-coverage" \
            --output-dir "$RUNNER_TEMP/cbmc-coverage-joined" \
            --exceptions proofs/cbmc/coverage-exceptions.json \
            --parameter-set 2=ML-KEM-512 \
            --parameter-set 3=ML-KEM-768 \
            --parameter-set 4=ML-KEM-1024 \
            --expected-variant default \
            --expected-data-model ILP32 \
            --expected-data-model LP64
      - name: Upload joined CBMC coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbmc-coverage
          path: ${{ runner.temp }}/cbmc-coverage-joined/
          if-no-files-found: error
          retention-days: 7
