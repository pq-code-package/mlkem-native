name: Mirror issues
permissions:
  contents: read
on:
  schedule:
    # Run hourly
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror sibling issues flagged for porting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror issues and merged PRs flagged for porting
        run: python3 .github/scripts/mirror-issues.py
