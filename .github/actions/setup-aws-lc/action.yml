name: Setup AWS-LC
description: Setup AWS-LC

inputs:
  dir:
    description: Directory to fetch AWS-LC into
    default: 'AWS-LC'
  repository:
    description: Repository to fetch from
    default: 'aws/AWS-LC'
  commit:
    description: Commit to fetch
    default: 'HEAD'
  gh_token:
    description: Github access token to use
    required: true

runs:
  using: composite
  steps:
    - name: Fetch AWS-LC
      shell: bash
      env:
        SRC_COMMIT: ${{ inputs.commit }}
        SRC_DIR: ${{ inputs.dir }}
        SRC_REPOSITORY: ${{ inputs.repository }}
      run: |
        mkdir "$SRC_DIR" && cd "$SRC_DIR"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/$SRC_DIR"
        git init
        git remote add origin "$GITHUB_SERVER_URL/$SRC_REPOSITORY"
        git fetch origin --depth 1 "$SRC_COMMIT"
        git checkout FETCH_HEAD

        # Remember AWS-LC directory
        echo AWSLC_DIR="$GITHUB_WORKSPACE/$SRC_DIR" >> $GITHUB_ENV
        AWSLC_DIR=$GITHUB_WORKSPACE/$SRC_DIR
