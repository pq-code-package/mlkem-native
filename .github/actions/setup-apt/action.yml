name: Dependencies (apt)
description: Install dependencies via apt

inputs:
  packages:
    description: Space-separated list of additional packages to install
    required: false
    default: ''
  sudo:
    required: false
    default: 'sudo'

runs:
  using: composite
  steps:
    - name: Update package repository
      shell: bash
      env:
        SUDO: ${{ inputs.sudo }}
      run: |
        # SUDO is an optional command prefix and PACKAGES a list, so both
        # are deliberately left unquoted.
        $SUDO apt-get update
    - name: Install base packages
      shell: bash
      env:
        SUDO: ${{ inputs.sudo }}
      run: |
        $SUDO apt-get install make gcc python3 -y
    - name: Install additional packages
      if: ${{ inputs.packages != ''}}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        SUDO: ${{ inputs.sudo }}
      run: |
        $SUDO apt-get install $PACKAGES -y
