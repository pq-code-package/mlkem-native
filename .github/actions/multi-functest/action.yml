name: Multiple Functional tests
description: Run functional tests

inputs:
  nix-shell:
    description: Run in the specified Nix environment if exists
    default: "ci"
  custom_shell:
    description: The shell to use. Only relevant if no nix-shell specified
    default: "bash"
  nix-cache:
    description: Determine whether to enable nix cache
    default: 'false'
  nix-verbose:
    description: Determine wether to suppress nix log or not
    default: 'false'
  gh_token:
    description: Github access token to use
    required: true
  cflags:
    description: CFLAGS to pass to compilation
    default: ""
  ldflags:
    description: LDFLAGS to pass to linking
    default: ""
  compile_mode:
    description: all | native | cross-x86_64 | cross-aarch64 | cross-ppc64le | cross-aarch64_be | cross-riscv64 | cross-riscv32
    default: "native"
  exec_wrapper:
    description: QEMU exec wrapper override for cross runs (per-platform default when empty)
    default: ""
  opt:
    description: all | opt | no_opt
    default: "all"
  func:
    description: Determine whether to run functional test or not
    default: "true"
  kat:
    description: Determine whether to run kat test or not
    default: "true"
  acvp:
    description: Determine whether to run acvp test or not
    default: "true"
  wycheproof:
    description: Determine whether to run wycheproof test or not
    default: "true"
  examples:
    description: Determine whether to run examples or not
    default: "true"
  unit:
    description: Determine whether to run unit tests or not
    default: "true"
  check_namespace:
    description: Determine whether to check namespacing or not
    default: "true"
  stack:
    description: Determine whether to run stack analysis or not
    default: "false"
  alloc:
    description: Determine whether to run alloc tests or not
    default: "true"
  rng_fail:
    description: Determine whether to run rng fail tests or not
    default: "true"
  extra_args:
    description: Additional arguments to pass to the tests script
    default: ""
  extra_env:
    description: Additional environment variables to set when calling the tests script
    default: ""
  sys_expected_native:
    description: Expected sys.h snapshot for native runs
    default: ""
  sys_expected_cross_x86_64:
    description: Expected sys.h snapshot for x86_64 cross runs
    default: "test/sys/expected/linux-x86_64-c99.txt"
  sys_expected_cross_aarch64:
    description: Expected sys.h snapshot for aarch64 cross runs
    default: "test/sys/expected/linux-aarch64-modern-c99.txt"
  sys_expected_cross_ppc64le_power8:
    description: Expected sys.h snapshot for ppc64le POWER8 cross runs
    default: "test/sys/expected/linux-ppc64le-c99.txt"
  sys_expected_cross_ppc64le_power7:
    description: Expected sys.h snapshot for ppc64le POWER7 cross runs
    default: "test/sys/expected/linux-ppc64le-c99.txt"
  sys_expected_cross_aarch64_be:
    description: Expected sys.h snapshot for aarch64_be cross runs
    default: "test/sys/expected/linux-aarch64_be-c99.txt"
  sys_expected_cross_riscv64:
    description: Expected sys.h snapshot for riscv64 cross runs
    default: "test/sys/expected/linux-riscv64-rvv-c99.txt"
  sys_expected_cross_riscv32:
    description: Expected sys.h snapshot for riscv32 cross runs
    default: "test/sys/expected/linux-riscv32-c99.txt"
runs:
  using: composite
  steps:
      - name: Native Tests
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'native') }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: ${{ inputs.cflags }}
          ldflags: ${{ inputs.ldflags }}
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_native != '' && inputs.sys_expected_native || runner.arch == 'X64' && 'test/sys/expected/linux-x86_64-c99.txt' || runner.arch == 'ARM64' && 'test/sys/expected/linux-aarch64-modern-c99.txt' || runner.arch == 'PPC64' && 'test/sys/expected/linux-ppc64le-c99.txt' }}
      - name: Cross x86_64 Tests
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-x86_64') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_X86_64"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: x86_64-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-x86_64' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_x86_64 }}
      - name: Cross aarch64 Tests
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-aarch64') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_AARCH64"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: aarch64-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-aarch64' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_aarch64 }}
      - name: Cross ppc64le Tests (POWER8)
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-ppc64le') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_PPC64LE -mcpu=power8"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: powerpc64le-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-ppc64le -cpu power8' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_ppc64le_power8 }}
      - name: Cross ppc64le Tests (POWER7 fallback path)
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-ppc64le') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_PPC64LE -mcpu=power7"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: powerpc64le-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-ppc64le -cpu power8' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_ppc64le_power7 }}
      - name: Cross aarch64_be Tests
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-aarch64_be') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -static  -DMLK_FORCE_AARCH64_EB"
          ldflags: "${{ inputs.ldflags }} -static"
          cross_prefix: aarch64_be-none-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-aarch64_be' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_aarch64_be }}
      - name: Cross riscv64 Tests (RVV)
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-riscv64') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_RISCV64"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: riscv64-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-riscv64 -cpu rv64,v=true,vlen=128' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_riscv64 }}
      - name: Cross riscv32 Tests
        if: ${{ (inputs.compile_mode == 'all' || inputs.compile_mode == 'cross-riscv32') && (success() || failure()) }}
        uses: ./.github/actions/functest
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          cflags: "${{ inputs.cflags }} -DMLK_FORCE_RISCV32"
          ldflags: ${{ inputs.ldflags }}
          cross_prefix: riscv32-unknown-linux-gnu-
          exec_wrapper: "${{ inputs.exec_wrapper != '' && inputs.exec_wrapper || 'qemu-riscv32' }}"
          opt: ${{ inputs.opt }}
          func: ${{ inputs.func }}
          kat: ${{ inputs.kat }}
          unit: ${{ inputs.unit }}
          acvp: ${{ inputs.acvp }}
          wycheproof: ${{ inputs.wycheproof }}
          examples: ${{ inputs.examples }}
          check_namespace: ${{ inputs.check_namespace }}
          stack: ${{ inputs.stack }}
          alloc: ${{ inputs.alloc }}
          rng_fail: ${{ inputs.rng_fail }}
          extra_args: ${{ inputs.extra_args }}
          extra_env: ${{ inputs.extra_env }}
          sys_expected: ${{ inputs.sys_expected_cross_riscv32 }}
