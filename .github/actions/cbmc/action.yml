name: CBMC
description: Run CBMC proofs for mlkem-native

inputs:
  nix-shell:
    description: Run in the specified Nix environment if exists
    default: "cbmc"
  nix-cache:
    description: Determine whether to enable nix cache
    default: 'true'
  nix-verbose:
    description: Determine wether to suppress nix log or not
    default: 'false'
  custom_shell:
    description: The shell to use. Only relevant if use-nix is 'false'
    default: "bash"
  mlkem_k:
    description: "Security level for ML-KEM (2,3,4)"
    default: "2"
  gh_token:
    description: Github access token to use
    required: true
runs:
  using: composite
  steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-shell
        with:
          nix-shell: ${{ inputs.nix-shell }}
          nix-cache: ${{ inputs.nix-cache }}
          nix-verbose: ${{ inputs.nix-verbose }}
          gh_token: ${{ inputs.gh_token }}
          custom_shell: ${{ inputs.custom_shell }}
          script: |

            if [[ ${{ inputs.nix-shell }} != '' ]]; then
              nix-collect-garbage
            fi

            cat >> $GITHUB_STEP_SUMMARY << EOF
              ## Setup
              Architecture: $(uname -m)
              - $(nix --version)
              - $(cbmc --version)
              - litani Version $(litani --version)
              - $(bash --version | grep -m1 "")
            EOF
      - name: Run CBMC proofs (MLKEM_K=${{ inputs.mlkem_k }})
        shell: ${{ env.SHELL }}
        env:
          ACTION_PATH: ${{ github.action_path }}
          GH_TOKEN: ${{ inputs.gh_token }}
          PARAMETER_SET: ${{ inputs.mlkem_k }}
          RESULTS_DIR: ${{ runner.temp }}/cbmc-results
        run: |
          echo "::group::cbmc_$PARAMETER_SET"
          case "$PARAMETER_SET" in
            2) parameter_set_name=512 ;;
            3) parameter_set_name=768 ;;
            4) parameter_set_name=1024 ;;
            *) echo "::error::Unsupported MLKEM_K: $PARAMETER_SET"; exit 1 ;;
          esac
          # Write the results at their gh-pages path; see cbmc_publish.yml.
          result="$RESULTS_DIR/dev/cbmc/mlkem-$parameter_set_name.json"
          mkdir -p "$(dirname "$result")"
          tests cbmc --mlkem-parameter-set "$PARAMETER_SET" --dm all --solver all --per-proof-timeout 1800 --output-result-json "$result" || cbmc_failed=true
          echo "::endgroup::"
          python3 "$ACTION_PATH/report.py" \
            --results-json "$result" \
            --mlkem-k "$PARAMETER_SET" \
            --min-runtime 20 \
            --regression-threshold 1.5 \
            --gh-pages-branch gh-pages \
            --data-dir dev/cbmc
          if [ "$cbmc_failed" = "true" ]; then exit 1; fi
      - name: Upload CBMC results for publishing
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbmc-results-mlkem-k${{ inputs.mlkem_k }}
          path: ${{ runner.temp }}/cbmc-results/
          if-no-files-found: error
          retention-days: 7
