  - path: test/configs/custom_heap_alloc_config.h
    description: "Test configuration with heap-based allocation"
    defines:
      MLK_CONFIG_CUSTOM_ALLOC_FREE:
        content: |
          /* In practice, one could just use aligned_alloc here. However, this
           * requires aligning up the size to a multiple of the alignment, which
           * weakens some of the memory-safety tests we run using this config. */
          #define MLK_CONFIG_CUSTOM_ALLOC_FREE
          #if !defined(__ASSEMBLER__)
          #if defined(_WIN32)
          #include <malloc.h>
          #define MLK_CUSTOM_ALLOC(v, T, N) \
            T *v = (T *)_aligned_malloc(sizeof(T) * (N), MLK_DEFAULT_ALIGN)
          #define MLK_CUSTOM_FREE(v, T, N) _aligned_free(v)
          #else
          #include <stdlib.h>
          static inline void *mlk_posix_memalign(size_t align, size_t sz)
          {
            void *ptr = NULL;
            if (posix_memalign(&ptr, align, sz) != 0)
              return NULL;
            return ptr;
          }
          #define MLK_CUSTOM_ALLOC(v, T, N) \
            T *v = (T *)mlk_posix_memalign(MLK_DEFAULT_ALIGN, sizeof(T) * (N))
          #define MLK_CUSTOM_FREE(v, T, N) free(v)
          #endif /* _WIN32 */
          #endif /* !__ASSEMBLER__ */

  - path: examples/context_parameter/mlkem_native/mlkem_native_config.h
    description: "Configuration with a context parameter and custom allocation"
    defines:
      MLK_CONFIG_NAMESPACE_PREFIX: mlkem
      MLK_CONFIG_CONTEXT_PARAMETER:
        content: |
          #define MLK_CONFIG_CONTEXT_PARAMETER
          #if !defined(__ASSEMBLER__)
          #include "../example_context.h"
          #endif /* !__ASSEMBLER__ */
      MLK_CONFIG_CONTEXT_PARAMETER_TYPE: example_context *
      MLK_CONFIG_CUSTOM_ALLOC_FREE:
        content: |
          #define MLK_CONFIG_CUSTOM_ALLOC_FREE
          #if !defined(__ASSEMBLER__)
          #define MLK_CUSTOM_ALLOC(v, T, N, context) \
            T *v = example_context_malloc((context), sizeof(T) * (N))
          #define MLK_CUSTOM_FREE(v, T, N, context) \
            example_context_free((context), (v), sizeof(T) * (N))
          #endif /* !__ASSEMBLER__ */
      MLK_CONFIG_FILE:
        comment: "/* No need to set this -- we _are_ already in a custom config */"

